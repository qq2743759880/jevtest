[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevtest"
version = "0.1.0"
description = "JevTest Triage: network device automation test failure triager"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typesafe-sdk>=0.7,<1",
    "pyyaml>=6",
    "python-dotenv>=1",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
web = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
]
mcp = [
    "mcp>=1.29,<2",
]

[project.scripts]
jevtest = "jevtest.cli:main"
jevtest-mcp = "jevtest.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jevtest = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.setuptools.data-files]
contracts = ["contracts/*.json", "contracts/*.yaml"]
config = ["config/*.json", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
